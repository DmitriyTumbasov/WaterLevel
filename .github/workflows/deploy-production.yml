name: Deploy production

# Только вручную. Автоматического выката на прод нет намеренно:
# решение о выпуске принимает человек.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: SHA-тег образа. Пусто — текущая вершина main.
        type: string
        required: false
      reason:
        description: Зачем выкатываем (попадёт в журнал запуска)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Выкат на прод
    runs-on: ubuntu-latest
    # Окружение production защищено обязательным одобрением: job не начнётся,
    # пока человек не подтвердит запуск. Здесь же лежит пароль базы прода.
    environment: production

    env:
      APP_PORT: 8080
      COLLECT_INTERVAL_MINUTES: 60
      PROJECT: waterlevel-production
      DEPLOY_DIR: /opt/waterlevel/production
      # На проде неудачный smoke-тест возвращает предыдущий образ.
      ROLLBACK_ON_FAILURE: "true"

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Определить образ
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          INPUT_TAG: ${{ inputs.image_tag }}
          FALLBACK_SHA: ${{ github.sha }}
        run: |
          tag="${INPUT_TAG:-$FALLBACK_SHA}"
          if [ -z "$tag" ]; then
            echo "Не удалось определить тег образа" >&2
            exit 1
          fi

          name="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/waterlevel:$tag"
          echo "ref=$name" >> "$GITHUB_OUTPUT"
          echo "Выкатываем: $name"

      - name: Подготовить SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_SSH_HOST }}
        run: |
          umask 077
          mkdir -p ~/.ssh

          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy
          chmod 644 ~/.ssh/known_hosts

          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "Секрет DEPLOY_KNOWN_HOSTS пуст — заполните его выводом ssh-keyscan" >&2
            exit 1
          fi

          if ! ssh-keygen -F "$HOST" -f ~/.ssh/known_hosts >/dev/null; then
            echo "В DEPLOY_KNOWN_HOSTS нет записи для $HOST" >&2
            exit 1
          fi

          if ! ssh-keygen -y -f ~/.ssh/id_deploy >/dev/null 2>&1; then
            echo "DEPLOY_SSH_KEY не читается как приватный ключ" >&2
            exit 1
          fi

      - name: Доставить конфигурацию на сервер
        env:
          HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          APP_IMAGE: ${{ steps.image.outputs.ref }}
          PG_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          umask 077
          cat > env.deploy <<EOF
          APP_IMAGE=${APP_IMAGE}
          APP_PORT=${APP_PORT}
          POSTGRES_PASSWORD=${PG_PASSWORD}
          COLLECT_INTERVAL_MINUTES=${COLLECT_INTERVAL_MINUTES}
          EOF

          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$USER_NAME@$HOST" \
            "mkdir -p '$DEPLOY_DIR'"

          scp -i ~/.ssh/id_deploy -P "$SSH_PORT" \
            deploy/docker-compose.yml "$USER_NAME@$HOST:$DEPLOY_DIR/docker-compose.yml"
          scp -i ~/.ssh/id_deploy -P "$SSH_PORT" \
            env.deploy "$USER_NAME@$HOST:$DEPLOY_DIR/.env"

          rm -f env.deploy

      - name: Выкатить, проверить живость, при неудаче откатить
        env:
          HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$USER_NAME@$HOST" \
            "chmod 600 '$DEPLOY_DIR/.env' && DEPLOY_DIR='$DEPLOY_DIR' PROJECT='$PROJECT' APP_PORT='$APP_PORT' ROLLBACK_ON_FAILURE='$ROLLBACK_ON_FAILURE' bash -s" \
            < deploy/remote-deploy.sh

      - name: Убрать ключ
        if: always()
        run: rm -f ~/.ssh/id_deploy

      - name: Записать итог
        if: always()
        env:
          APP_IMAGE: ${{ steps.image.outputs.ref }}
          RESULT: ${{ job.status }}
          REASON: ${{ inputs.reason }}
        run: |
          {
            echo "### Выкат на прод: $RESULT"
            echo
            echo "Образ:"
            echo '```'
            echo "$APP_IMAGE"
            echo '```'
            if [ -n "$REASON" ]; then
              echo
              echo "Причина: $REASON"
            fi
            echo
            echo "Откат вручную: запустите этот workflow с прошлым SHA-тегом."
          } >> "$GITHUB_STEP_SUMMARY"
