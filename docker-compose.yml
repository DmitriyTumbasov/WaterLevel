services:
  web:
    build:
      context: ./WaterLevel.Web
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=waterlevel;Username=waterlevel;Password=waterlevel
      Collector__SourceUrl: https://pogoda43.ru/wp-content/themes/kcgms/framework/gidromet/get_cur_water.php?tp=water_level
      Collector__StationId: 76556
      Collector__IntervalMinutes: 60
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: waterlevel
      POSTGRES_USER: waterlevel
      POSTGRES_PASSWORD: waterlevel
    ports:
      # Только петлевой интерфейс: база нужна снаружи разве что для локальной
      # отладки клиентом. Без явного 127.0.0.1 Docker публикует порт на все
      # интерфейсы, и на машине с внешним IP база оказывается в интернете.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres-data:
